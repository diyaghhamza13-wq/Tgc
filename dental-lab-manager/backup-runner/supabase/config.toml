# Backup Runner — a SEPARATE Supabase project (EU London, eu-west-2) that runs the
# automated backup of the Dental Lab Manager production project.
# See docs/backup/BACKUP-RUNNER.md. Nothing here is deployed; local ports below
# differ from the production project's so both local stacks can run side by side.
project_id = "dlm-backup-runner"

[api]
enabled = true
port = 54331
# The runner's own API exposes nothing to the internet beyond its RPCs, which
# are service_role-only (its own service key, never production's).
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 17

[db.pooler]
enabled = false
port = 54339

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 54333

[local_smtp]
enabled = false
port = 54334

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600

# LOCAL TESTS ONLY: a signing key generated by the test into this path (gitignored,
# deleted afterwards), so the runner's local keys differ from production's.
signing_keys_path = "./signing_keys.json"

[auth.email]
enabled = false


[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54337

# The function authenticates its caller with the trigger secret (pg_cron in THIS
# project), not with a Supabase JWT.
[functions.dlm-backup]
verify_jwt = false
